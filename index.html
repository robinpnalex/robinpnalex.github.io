<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>robin alex</title>
  <link rel="icon" href="images/favicon.png" />
  <link rel="stylesheet" href="shortcuts.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fff; color: #111; font-family: Georgia, serif; }

    #site {
      width: 100%;
      min-height: 100vh;
      transition: filter 1.4s ease, opacity 1.4s ease;
    }

    body.intro-running #site {
      filter: blur(14px);
      opacity: 0.35;
      animation: siteReveal 2.4s ease forwards;
    }

    #intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.58);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: introFade 2.4s ease forwards;
      pointer-events: none;
    }

    #intro img {
      width: clamp(150px, 34vw, 340px);
      animation: robinIntro 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    body.dark #intro {
      background: rgba(17, 17, 17, 0.62);
    }

    body.dark #intro img {
      filter: invert(1);
    }

    @keyframes robinIntro {
      0% {
        opacity: 1;
        transform: scale(1.35);
      }
      58% {
        opacity: 1;
        transform: scale(0.86);
      }
      100% {
        opacity: 0;
        transform: scale(0.34);
      }
    }

    @keyframes introFade {
      0% {
        opacity: 1;
      }
      62% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        visibility: hidden;
      }
    }

    @keyframes siteReveal {
      0% {
        filter: blur(14px);
        opacity: 0.35;
      }
      46% {
        filter: blur(14px);
        opacity: 0.35;
      }
      100% {
        filter: blur(0);
        opacity: 1;
      }
    }

    .site-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: clamp(20px, 3vw, 44px) clamp(20px, 4vw, 64px) 0;
    }

    .site-header button,
    .copy-email {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    .site-header h1 { font-weight: normal; }
    .site-name { font: clamp(24px, 2.6vw, 38px) Georgia, serif; }
    #robin-logo img { display: block; width: clamp(32px, 4vw, 52px); }
    body.dark #robin-logo img,
    body.dark .home-batman { filter: invert(1); }

    #home {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
      gap: clamp(32px, 8vw, 120px);
      align-items: start;
      padding: clamp(24px, 4vw, 56px) clamp(20px, 4vw, 64px) 80px;
    }

    .home-text {
      display: grid;
      gap: clamp(20px, 2.4vw, 32px);
      line-height: 1.5;
    }

    .home-about {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
      align-items: start;
      gap: clamp(12px, 2vw, 24px);
    }

    .home-text h2 {
      margin-bottom: 6px;
      font-size: 1.15rem;
      font-weight: normal;
    }

    .home-text a { color: inherit; }
    .home-text p + p { margin-top: 8px; }

    .home-contact {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .home-batman {
      display: block;
      width: 100%;
      max-width: 160px;
      height: auto;
    }

    .copy-email {
      display: inline-grid;
      place-items: center;
      width: 44px;
      height: 44px;
    }

    .email-status {
      font-size: 0.875rem;
      overflow-wrap: anywhere;
    }

    .home-photos {
      grid-column: 2;
      display: grid;
      grid-template-columns: minmax(0, 52fr) minmax(0, 48fr);
      grid-template-rows: minmax(0, 17fr) minmax(0, 15fr);
      grid-template-areas:
        "flower tower"
        "power tower";
      gap: clamp(8px, 1.2vw, 18px);
      width: min(100%, 960px);
      aspect-ratio: 3 / 2;
    }

    .home-photos img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .home-flower { grid-area: flower; }
    .home-power {
      grid-area: power;
      object-position: center top;
    }
    .home-tower { grid-area: tower; }

    #menu { display: none; width: 100%; min-height: 75vh; position: relative; }
    #menu.visible {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2.4vh;
    }

    #menu a {
      position: static;
      display: block;
      cursor: pointer;
      text-decoration: none;
      color: #111;
      font-family: Georgia, serif;
      transition: transform 0.15s ease;
    }

    #menu a.selected { transform: scale(1.25); }
    #menu a.soon { opacity: 0.35; cursor: default; }

    #github   { font-size: clamp(22px, 2.4vw, 42px); }
    #blogs, #notes { font-size: clamp(22px, 2.4vw, 42px); }
    #projects { font-size: clamp(22px, 2.4vw, 42px); }

    @media (max-width: 720px) {
      #home { grid-template-columns: 1fr; gap: 28px; }
      .home-photos { grid-column: 1; }

      #menu.visible {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 5vh;
      }
      #menu a { position: static; }
    }

    body.dark { background: #111; color: #eee; }
    body.dark #menu a { color: #eee; }

    #hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #888;
      opacity: 0.6;
      font-size: clamp(11px, 0.85vw, 14px);
      letter-spacing: 0.1em;
      z-index: 10;
    }

  </style>
</head>
<body class="intro-running dark">
  <div id="intro" aria-hidden="true">
    <img src="images/robin.svg" alt="" />
  </div>

  <div id="site">
    <header class="site-header">
      <button id="robin-logo" type="button" aria-label="Home">
        <img src="images/robin.svg" alt="">
      </button>
      <h1><button class="site-name" type="button" aria-controls="menu" aria-expanded="false">robin alex</button></h1>
    </header>
    <main id="home">
      <div class="home-text">
        <div class="home-about">
          <img class="home-batman" src="images/batman.svg" alt="Batman" width="800" height="800">
          <p>Hi, this is my house on the internet.<br>
            Have a look around.</p>
        </div>
        <section aria-labelledby="writing-heading">
          <h2 id="writing-heading">writing</h2>
          <p><a href="blogs.html">Blogs</a> on what I’m exploring, including <a href="blogs/looking-inside-a-text-to-image-prompt-generator.html">a look inside a text-to-image prompt generator</a>.</p>
          <p><a href="notes.html">Notes</a> for paper reviews, links, and loose thoughts on AI.</p>
        </section>
        <div class="home-contact">
          <button class="copy-email" type="button" aria-label="Copy email address" title="Copy email address">
            <svg width="26" height="20" viewBox="0 0 26 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <rect x="1" y="1" width="24" height="18" rx="2"/>
              <path d="m2 3 11 9L24 3"/>
            </svg>
          </button>
          <p class="email-status" role="status" hidden></p>
        </div>
      </div>
      <div class="home-photos">
        <img class="home-flower" src="flower.JPG" alt="Photograph of a flower" width="4608" height="3456" />
        <img class="home-power" src="power.JPG" alt="Power photograph" width="4608" height="3456" />
        <img class="home-tower" src="tower.JPG" alt="Photograph of a tower" width="3456" height="4608" />
      </div>
    </main>

    <div id="menu">
      <a id="github"   href="https://github.com/robinpnalex" target="_blank">github</a>
      <a id="blogs"    href="blogs.html">blogs</a>
      <a id="notes" href="notes.html">notes</a>
      <a id="projects" class="soon" href="#">projects</a>
    </div>

    <div id="hint">enter</div>

  </div>

  <script>
    const intro = document.getElementById('intro');
    const home = document.getElementById('home');
    const menu = document.getElementById('menu');
    const hint = document.getElementById('hint');

    const HOME_HINT = 'enter';
    const nameButton = document.querySelector('.site-name');
    const nameHeading = nameButton.closest('h1');
    const emailStatus = document.querySelector('.email-status');

    document.querySelector('.copy-email').addEventListener('click', async function () {
      const email = 'robinalexpnn@gmail.com';
      try {
        await navigator.clipboard.writeText(email);
        emailStatus.textContent = 'Email copied.';
      } catch {
        emailStatus.textContent = email;
      }
      emailStatus.hidden = false;
    });

    intro.addEventListener('animationend', function () {
      document.body.classList.remove('intro-running');
      intro.remove();
    }, { once: true });

    function openMenu() {
      home.style.display = 'none';
      menu.classList.add('visible');
      nameButton.setAttribute('aria-expanded', 'true');
      nameHeading.hidden = true;
      hint.hidden = true;
    }

    function closeMenu() {
      menu.classList.remove('visible');
      nameButton.setAttribute('aria-expanded', 'false');
      nameHeading.hidden = false;
      home.style.display = '';
      hint.textContent = HOME_HINT;
      hint.hidden = false;
    }

    nameButton.addEventListener('click', openMenu);
    document.getElementById('robin-logo').addEventListener('click', closeMenu);

    function openMenuIfHash(event) {
      if (location.hash !== '#menu') return;

      history.replaceState(history.state, '', location.pathname + location.search);
      if (!event && performance.getEntriesByType('navigation')[0]?.type === 'reload') return;

      document.body.classList.remove('intro-running');
      document.getElementById('intro')?.remove();
      openMenu();
    }

    openMenuIfHash();
    window.addEventListener('pageshow', function (e) { if (e.persisted) openMenuIfHash(); });
    window.addEventListener('hashchange', openMenuIfHash);

  </script>
  <script src="shortcuts.js"></script>
</body>
</html>

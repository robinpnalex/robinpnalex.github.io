<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>robin alex</title>
  <link rel="icon" type="image/svg+xml" href="images/robin.svg">
  <link rel="stylesheet" href="css/shortcuts.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fff; color: #111; font-family: Georgia, serif; }

    #site {
      width: 100%;
      min-height: 100vh;
      transition: filter 1.4s ease, opacity 1.4s ease;
    }

    body.intro-running #site {
      filter: blur(14px);
      opacity: 0.35;
      animation: siteReveal 2.4s ease forwards;
    }

    #intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.58);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: introFade 2.4s ease forwards;
      pointer-events: none;
    }

    #intro img {
      width: clamp(150px, 34vw, 340px);
      animation: robinIntro 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    body.dark #intro {
      background: rgba(17, 17, 17, 0.62);
    }

    body.dark #intro img {
      filter: invert(1);
    }

    @keyframes robinIntro {
      0% {
        opacity: 1;
        transform: scale(1.35);
      }
      58% {
        opacity: 1;
        transform: scale(0.86);
      }
      100% {
        opacity: 0;
        transform: scale(0.34);
      }
    }

    @keyframes introFade {
      0% {
        opacity: 1;
      }
      62% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        visibility: hidden;
      }
    }

    @keyframes siteReveal {
      0% {
        filter: blur(14px);
        opacity: 0.35;
      }
      46% {
        filter: blur(14px);
        opacity: 0.35;
      }
      100% {
        filter: blur(0);
        opacity: 1;
      }
    }

    #home {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
      column-gap: clamp(32px, 8vw, 120px);
      padding-inline: clamp(20px, 4vw, 64px);
    }

    .site-header {
      display: flex;
      align-items: center;
      padding-inline: clamp(20px, 4vw, 64px);
      padding-top: clamp(20px, 3vw, 44px);
    }

    .site-header button,
    .welcome-mat,
    [data-copy-email] {
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    #robin-logo img { display: block; width: clamp(32px, 4vw, 52px); }
    body.dark #robin-logo img,
    body.dark .home-batman { filter: invert(1); }

    #home {
      align-items: start;
      padding-top: clamp(24px, 4vw, 56px);
      padding-bottom: 80px;
    }

    .home-text {
      --welcome-mat-width: 300px;
      display: grid;
      gap: clamp(20px, 2.4vw, 32px);
      line-height: 1.5;
    }

    .home-about {
      display: grid;
      justify-items: center;
      gap: clamp(12px, 2vw, 24px);
      margin-top: 12px;
    }

    .home-about p {
      width: min(100%, var(--welcome-mat-width));
      /* Match the transparent left inset in welcome.webp. */
      padding-left: min(3.8%, calc(var(--welcome-mat-width) * 0.038));
    }

    .welcome-mat {
      justify-self: center;
      display: block;
      margin-top: 12px;
      width: min(100%, var(--welcome-mat-width));
      aspect-ratio: 1.64;
    }

    .welcome-mat img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .home-contact {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .home-batman {
      display: block;
      width: min(40%, 160px);
      height: auto;
    }

    .copy-email {
      display: inline-grid;
      place-items: center;
      width: 44px;
      height: 44px;
    }

    .reach-out { font: inherit; text-align: left; }

    .home-about .email-status:not([hidden]) { display: block; }

    .email-status {
      font-size: 0.875rem;
      overflow-wrap: anywhere;
    }

    .home-photos {
      grid-column: 2;
      display: grid;
      grid-template-columns: minmax(0, 52fr) minmax(0, 48fr);
      grid-template-rows: minmax(0, 17fr) minmax(0, 15fr);
      grid-template-areas:
        "flower tower"
        "power tower";
      gap: clamp(8px, 1.2vw, 18px);
      width: min(100%, 960px);
      aspect-ratio: 3 / 2;
    }

    .home-photos img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .home-flower { grid-area: flower; }
    .home-power {
      grid-area: power;
      object-position: center top;
    }
    .home-tower { grid-area: tower; }

    #menu { display: none; width: 100%; min-height: 75vh; position: relative; }
    #menu.visible {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2.4vh;
    }

    @media (prefers-reduced-motion: no-preference) {
      .welcome-mat { transition: transform 100ms ease-out; }
      .welcome-mat:active { transform: translateY(2px) scale(0.98); }
      #menu.visible { animation: menu-fade-in 150ms ease-out; }
    }

    @keyframes menu-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #menu a {
      position: static;
      display: block;
      cursor: pointer;
      text-decoration: none;
      color: #111;
      font-family: Georgia, serif;
      transition: transform 0.15s ease;
    }

    #menu a.selected { transform: scale(1.25); }
    #menu a.soon { opacity: 0.35; cursor: default; }

    #github   { font-size: clamp(22px, 2.4vw, 42px); }
    #blogs, #notes { font-size: clamp(22px, 2.4vw, 42px); }
    #projects { font-size: clamp(22px, 2.4vw, 42px); }

    @media (max-width: 720px) {
      #home { grid-template-columns: minmax(0, 1fr); }
      #home { row-gap: 28px; }
      .home-photos { grid-column: 1; }

      #menu.visible {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 5vh;
      }
      #menu a { position: static; }
    }

    body.dark { background: #111; color: #eee; }
    body.dark #menu a { color: #eee; }

  </style>
</head>
<body class="intro-running dark">
  <div id="intro" aria-hidden="true">
    <img src="images/robin.svg" alt="" />
  </div>

  <div id="site">
    <header class="site-header">
      <button id="robin-logo" type="button" aria-label="Home">
        <img src="images/robin.svg" alt="">
      </button>
    </header>
    <main id="home">
      <div class="home-text">
        <button class="welcome-mat" type="button" aria-label="Open menu" aria-controls="menu">
          <img src="images/home/welcome.webp" alt="" width="500" height="500">
        </button>
        <div class="home-about">
          <img class="home-batman" src="images/batman.svg" alt="Batman" width="800" height="800">
          <p>Hi, this is my house on the internet.<br>
            Have a look around.<br>
            <button class="reach-out" type="button" data-copy-email title="Copy email address"><u>reach out</u> if you want to connect</button>
            <span class="email-status" role="status" hidden></span>
          </p>
        </div>
      </div>
      <div class="home-photos">
        <img class="home-flower" src="images/home/flower.webp" alt="Photograph of a flower" width="1440" height="1080" />
        <img class="home-power" src="images/home/power.webp" alt="Power photograph" width="1440" height="1080" />
        <img class="home-tower" src="images/home/tower.webp" alt="Photograph of a tower" width="1080" height="1440" />
      </div>
    </main>

    <div id="menu">
      <a id="github"   href="https://github.com/robinpnalex" target="_blank">github</a>
      <a id="blogs"    href="blogs.html">blogs</a>
      <a id="notes" href="notes.html">notes</a>
      <a id="projects" class="soon" href="#">projects</a>
      <div class="home-contact">
        <button class="copy-email" type="button" data-copy-email aria-label="Copy email address" title="Copy email address">
          <svg width="26" height="20" viewBox="0 0 26 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="1" y="1" width="24" height="18" rx="2"/>
            <path d="m2 3 11 9L24 3"/>
          </svg>
        </button>
        <p class="email-status" role="status" hidden></p>
      </div>
    </div>

  </div>

  <script>
    const intro = document.getElementById('intro');
    const home = document.getElementById('home');
    const menu = document.getElementById('menu');
    const welcomeMat = document.querySelector('.welcome-mat');

    async function copyEmail(event) {
      const emailStatus = event.currentTarget.nextElementSibling;
      const email = 'robinalexpnn@gmail.com';
      let copied = false;
      try {
        await navigator.clipboard.writeText(email);
        copied = true;
      } catch {
        // Keep the address available for manual copying.
      }

      emailStatus.getAnimations().forEach(animation => animation.cancel());
      emailStatus.textContent = copied ? 'Email copied.' : email;
      emailStatus.hidden = false;
      if (!copied) return;

      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const fade = emailStatus.animate([
        { opacity: 1 },
        { opacity: 1, offset: 0.8, easing: reducedMotion ? 'step-end' : 'ease-out' },
        { opacity: 0 },
      ], 2000);
      fade.finished.then(
        () => { emailStatus.hidden = true; },
        () => {} // A new copy can cancel the previous fade.
      );
    }

    document.querySelectorAll('[data-copy-email]').forEach(button => {
      button.addEventListener('click', copyEmail);
    });

    intro.addEventListener('animationend', function () {
      document.body.classList.remove('intro-running');
      intro.remove();
    }, { once: true });

    function openMenu() {
      home.style.display = 'none';
      menu.classList.add('visible');
    }

    function closeMenu() {
      menu.classList.remove('visible');
      home.style.display = '';
    }

    welcomeMat.addEventListener('click', openMenu);
    document.getElementById('robin-logo').addEventListener('click', closeMenu);

    function openMenuIfHash(event) {
      if (location.hash !== '#menu') return;

      history.replaceState(history.state, '', location.pathname + location.search);
      if (!event && performance.getEntriesByType('navigation')[0]?.type === 'reload') return;

      document.body.classList.remove('intro-running');
      document.getElementById('intro')?.remove();
      openMenu();
    }

    openMenuIfHash();
    window.addEventListener('pageshow', function (e) { if (e.persisted) openMenuIfHash(); });
    window.addEventListener('hashchange', openMenuIfHash);

  </script>
  <script src="js/shortcuts.js"></script>
</body>
</html>
